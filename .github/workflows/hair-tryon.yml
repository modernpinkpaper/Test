name: hair-tryon

on:
  push:
    paths: ['hair-tryon/**', '.github/workflows/hair-tryon.yml']
  pull_request:
    paths: ['hair-tryon/**', '.github/workflows/hair-tryon.yml']
  workflow_dispatch:

jobs:
  engine-tests:
    name: Hair try-on engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node hair-tryon/test/engine.test.js
      - run: node hair-tryon/build-single.js
