# Posts one Amazon find or tip to Bluesky, 5 times a day.
# Needs repo secrets BLUESKY_HANDLE and BLUESKY_APP_PASSWORD; does nothing until they exist.
name: Bluesky

on:
  schedule:
    - cron: "15 13,16,19,22,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.BLUESKY_APP_PASSWORD != ''
      - uses: actions/setup-python@v5
        if: env.BLUESKY_APP_PASSWORD != ''
        with: { python-version: "3.11" }
      - if: env.BLUESKY_APP_PASSWORD != ''
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        if: env.BLUESKY_APP_PASSWORD != ''
        with:
          path: build/img-cache
          key: pins-bsky-${{ github.run_id }}
          restore-keys: pins-
      - if: env.BLUESKY_APP_PASSWORD != ''
        run: python tools/bluesky.py
      - if: env.BLUESKY_APP_PASSWORD != ''
        run: |
          git config user.name "automation"
          git config user.email "automation@users.noreply.github.com"
          git add state/bluesky.json
          git diff --cached --quiet || (git commit -m "Bluesky: record posted item" && git pull --rebase && git push)
