# Builds the website every morning and publishes it to GitHub Pages.
# New posts/finds whose date has arrived go live, the RSS feeds update,
# and Pinterest turns the new feed items into pins on its own.
name: Publish site

on:
  schedule:
    - cron: "0 11 * * *"   # every day, 7am US Eastern
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            build/img-cache
            build/social
          key: pins-${{ github.run_id }}
          restore-keys: pins-
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
